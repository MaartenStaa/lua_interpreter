[package]
name = "lua_interpreter"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
chrono = "0.4.42"
clap = { version = "4.5.52", features = ["derive"] }
cpu-time = "1.0.0"
crossterm = { version = "0.28", optional = true }
indexmap = "2.14.0"
miette = { version = "7.6.0", features = ["fancy", "syntect-highlighter"] }
paste = "1.0.15"
rand = { version = "0.9.3", features = ["thread_rng"] }
ratatui = { version = "0.29", optional = true, features = ["crossterm"] }
regex = "1.12.2"
short-uuid = "0.2.1"
subslice = "0.2.3"
thiserror = "2.0.17"
tree-sitter = { version = "0.26.10", optional = true }
tree-sitter-lua = { version = "0.5.0", optional = true }

[features]
debugger = [
  "dep:ratatui",
  "dep:crossterm",
  "dep:tree-sitter",
  "dep:tree-sitter-lua",
]

[profile.release]
debug = "line-tables-only"

[dev-dependencies]
rstest = "0.26.1"
